<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ennis Sculpture Trail — a self-guided walking tour of public art in Ennis, County Clare">
    <title>Ennis Sculpture Trail | Ennis Tidy Towns Heritage Tours</title>
    <link rel="icon" type="image/svg+xml" href="https://images.ennistidytowns.ie/logos/SuperValu-TidyTowns-Logo-Icon-2026.svg">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">

    <!-- MapTour v1.5.0 -->

            height: 100%;
            overflow: hidden;

            width: 100%;
            height: 100vh;
        }
    </style>

<body>

    <script src="https://mieslep.github.io/maptour/maptour.js"

    <script>
        MapTour.init({

            tourUrl: './ennis-sculpture-trail.yaml',

</html>
